<!-- ══════════ TOPBAR ══════════ -->
<div class="h-[50px] bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-4 gap-2.5 flex-shrink-0 shadow-[0_1px_4px_rgba(0,0,0,0.04)]">
  <!-- Sidebar toggle button (Desktop & Mobile) -->
  <button id="topbar-sidebar-toggle-btn" onclick="toggleSidebar()"
    class="p-1.5 rounded-lg border-0 bg-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/60 cursor-pointer flex items-center justify-center transition-all mr-1"
    title="Ẩn / Hiện thanh điều hướng">
    <!-- Icon when sidebar is open (click to collapse/hide) -->
    <svg id="topbar-sidebar-icon-collapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <line x1="9" y1="3" x2="9" y2="21"/>
      <path d="M14 9l-3 3 3 3"/>
    </svg>
    <!-- Icon when sidebar is collapsed (click to open/expand) -->
    <svg id="topbar-sidebar-icon-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <line x1="9" y1="3" x2="9" y2="21"/>
      <path d="M12 9l3 3-3 3"/>
    </svg>
  </button>

  <!-- Mobile hamburger -->
  <button id="topbar-menu-btn" onclick="toggleMobileMenu()"
    class="hidden bg-transparent border-0 cursor-pointer p-1 text-slate-500 dark:text-slate-400 text-lg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Page title -->
  <span id="topbar-title" class="text-[13px] font-bold flex-1 text-slate-900 dark:text-slate-100">
    Tìm người dùng
  </span>

  <!-- Dark mode toggle -->
  <button onclick="toggleTheme()" id="btn-theme"
    class="hidden p-1 px-2.5 rounded-full text-[12px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 border-[1.5px] border-slate-200 dark:border-slate-600 cursor-pointer hover:bg-blue-50 dark:hover:bg-slate-600 hover:text-blue-500 dark:hover:text-blue-400 transition-all"
    title="Chuyển đổi giao diện sáng/tối">
    <span id="theme-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
  </button>

  <!-- Language toggle -->
  <button onclick="toggleLang()" id="btn-lang"
    class="hidden p-1 px-2.5 rounded-full text-[10px] font-bold bg-blue-50 dark:bg-blue-900/30 text-blue-500 dark:text-blue-400 border-[1.5px] border-blue-200 dark:border-blue-800 cursor-pointer hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all">
    EN
  </button>
</div>
