<!-- ═════════════════ STEP 4: Xử lý & Theo dõi ═════════════════ -->
<section class="proc-step" data-proc-step="4" style="display:none">
  <div class="proc-step-head">
    <h2 class="proc-step-title" style="display:flex;align-items:center;gap:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Xử lý &amp; Theo dõi</span>
    </h2>
    <p class="proc-step-sub">Theo dõi tiến trình burn phụ đề/khung và nhật ký chi tiết bên dưới.</p>
  </div>

  <div class="proc-step5-grid">

    <!-- Progress -->
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="display:inline-flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Tiến trình</span>
        </span>
        <div class="card-actions">
          <button class="btn btn-secondary btn-sm" id="btn-proc-pause" style="display:none" onclick="procTogglePause()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            <span>Dừng</span>
          </button>
        </div>
      </div>
      <div class="progress-row">
        <span class="progress-label">Tổng thể</span>
        <div class="progress-bar-wrap"><div class="progress-bar pb-overall" id="pb-proc-overall"></div></div>
        <span class="progress-pct" id="pb-proc-overall-pct">0%</span>
      </div>
      <div class="progress-info text-muted" id="lbl-proc-overall">--</div>
      
      <div id="proc-done-actions" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="btn-group" style="flex-direction:column;gap:8px">
          <button class="btn btn-primary w-full justify-center" style="font-weight:700;display:inline-flex;align-items:center;gap:6px"
            onclick="_procImportAndAICaption()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
            <span>Import &amp; AI viết Caption → Đăng (Bước 5)</span>
          </button>
          <button class="btn btn-success w-full justify-center" onclick="sendLastProcessedToPublish()">
            <span>Chuyển sang Bước 5 (đã có caption) →</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div class="card card-collapsible">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="card-title" style="display:inline-flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Nhật ký</span>
        </span>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-secondary btn-sm" onclick="clearLog('proc-log')">Xóa</button>
        </div>
      </div>
      <div class="card-body">
        <div class="log-box" id="proc-log" style="height:360px"></div>
      </div>
    </div>

  </div><!-- /step5-grid -->
</section><!-- /step 4 -->
